<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIPS Visualizer</title>
    <meta name="description" content="MIPS アセンブリを 1 命令ずつ実行し、レジスタ・メモリ・PC の動きを見るための学習用シミュレーター" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='14' text-anchor='middle' fill='white' font-family='monospace' font-weight='bold'%3EMV%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <h1>MIPS Visualizer</h1>
      <div class="preset-wrap">
        <label class="sr" for="preset">プログラムを選ぶ</label>
        <select id="preset"></select>
        <span id="preset-note" class="preset-note"></span>
      </div>
      <div class="modes" role="group" aria-label="表示モード">
        <button data-mode="1" aria-pressed="true" title="レジスタとメモリの値の動きを見る">① かんたん</button>
        <button data-mode="2" aria-pressed="false" title="PC・機械語・番地まで見る">② 命令の中身</button>
        <button data-mode="3" aria-pressed="false" title="CPU の部品のあいだをデータが動く様子を見る">③ ブロック図</button>
      </div>
    </header>

    <nav class="controls" aria-label="実行の操作">
      <button id="btn-back" title="1ステップ戻る（Shift+F8）">⏮ 戻る</button>
      <button id="btn-step" class="primary" title="1ステップ実行（F8）">⏭ 1ステップ</button>
      <button id="btn-run" title="続けて実行（F5）">▶ 実行</button>
      <button id="btn-reset" title="最初の状態に戻す（プログラムはそのまま）">⟲ 最初から</button>
      <label class="ctl">速さ <select id="speed"></select></label>
      <span id="base-wrap" class="ctl" hidden>
        <label>数の表示
          <select id="base">
            <option value="dec">10進数（符号あり）</option>
            <option value="hex">16進数</option>
            <option value="bin">2進数</option>
          </select>
        </label>
      </span>
      <details class="settings">
        <summary>設定</summary>
        <div class="settings-body">
          <label>文字の大きさ
            <select id="font"><option value="s">小</option><option value="m">中</option><option value="l">大（プロジェクター）</option></select>
          </label>
          <label>表示
            <select id="theme"><option value="auto">OS に合わせる</option><option value="light">明るい</option><option value="dark">暗い</option></select>
          </label>
          <label class="check"><input type="checkbox" id="strict" /> 値を入れていないレジスタを読んだら止める（mipsy と同じ）</label>
          <p class="muted small">ブレークポイント：エディターの行番号をクリック。キー：F8 ＝ 1ステップ、Shift+F8 ＝ 戻る、F5 ＝ 実行</p>
        </div>
      </details>
      <button id="btn-share" title="このプログラムを開くリンクをコピー">🔗 リンク</button>
    </nav>

    <main class="layout">
      <div class="left">
        <section class="editor-card" aria-label="プログラム">
          <div id="editor"></div>
        </section>
        <section class="console" aria-label="コンソール">
          <h2>コンソール <small>（syscall で表示したもの）</small></h2>
          <pre id="console-out" class="empty"></pre>
          <form id="input-form" hidden>
            <label for="input">入力：</label>
            <input id="input" autocomplete="off" />
            <button type="submit">Enter</button>
          </form>
        </section>
      </div>
      <div id="view" class="right">
        <div id="view-main" class="view-main"></div>
        <section id="diagram-card" class="card dg-card" aria-label="ブロック図" hidden></section>
      </div>
    </main>
    <div id="toast" class="toast" hidden role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
